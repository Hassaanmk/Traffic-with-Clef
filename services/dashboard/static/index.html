<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic with Clef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&family=Overpass+Mono:wght@400;600&family=Public+Sans:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f4f6f5; --surface: #ffffff; --ink: #14201b; --muted: #58665f; --line: #d6ddd9;
  --sign: #0e6a48; --amber: #b06400; --red: #b3261e; --track: #e6ebe8;
  --cam-a: #0e6a48; --cam-b: #2a5a9a;
  --hud-bg: #0b100e; --hud-chip: rgba(255, 255, 255, 0.16); --hud-ink: #ffffff;
  --display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --body: "Public Sans", system-ui, sans-serif;
  --mono: "Overpass Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1311; --surface: #151d19; --ink: #e2e9e5; --muted: #97a59e; --line: #2a3530;
          --sign: #3aa97c; --amber: #f0a43c; --red: #ef8a83; --track: #222c27;
          --cam-a: #3aa97c; --cam-b: #86ade3; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font: 800 1.9rem/1.1 var(--display); margin: 0; }
h2 { font: 800 1.15rem/1.2 var(--display); margin: 0; }
.status { font: 0.82rem var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sign); }
.dot.stale { background: var(--amber); } .dot.down { background: var(--red); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.stat .k { font: 600 0.72rem var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stat .v { font: 800 1.6rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat .s { font-size: 0.8rem; color: var(--muted); }
.meter { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--sign); }

.cams { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.cam { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.stage { position: relative; background: #000; }
.stage video { width: 100%; aspect-ratio: 352 / 288; object-fit: cover; display: block; }
/* A solid bar over TfL's burned-in camera name strip; the name is repeated in the card title. */
.hud { position: absolute; left: 0; right: 0; bottom: 0; min-height: 11%; padding: 6px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
       background: var(--hud-bg); color: var(--hud-ink); }
.hud.stale > * { opacity: 0.5; }
.hud-level { font: 800 1.05rem var(--display); margin-right: 4px; }
.hud .chip { font: 600 0.74rem var(--mono); background: var(--hud-chip); padding: 2px 7px; border-radius: 4px; }
.flash { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); font: 600 0.78rem var(--mono); white-space: nowrap;
         background: var(--amber); color: #111; padding: 4px 10px; border-radius: 4px; }
.timeline { padding: 10px 16px 0; display: flex; flex-direction: column; gap: 2px; }
.track { position: relative; height: 22px; margin: 0 8px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--track); }
.tick { position: absolute; top: 2px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; border: 2px solid var(--muted);
        background: var(--surface); color: var(--muted); font: 600 10px/14px var(--mono); text-align: center; font-style: normal; }
.tick.hit { background: var(--amber); border-color: var(--amber); color: #111; }
.head { position: absolute; top: 1px; width: 2px; height: 20px; margin-left: -1px; background: var(--sign); }
.tl-caption { font: 0.74rem var(--mono); color: var(--muted); }
.match { font: 600 0.74rem var(--mono); padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.match.ok { color: var(--sign); background: var(--track); }
.match.new { color: var(--amber); background: var(--track); }
.match.unknown { color: var(--muted); }
.cam .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.cam .title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.cam .when { font: 0.78rem var(--mono); color: var(--muted); white-space: nowrap; }
.cong { display: flex; flex-direction: column; gap: 6px; }
.cong .row { display: flex; justify-content: space-between; align-items: baseline; }
.cong .label { font: 800 1.35rem var(--display); }
.cong .num { font: 600 0.85rem var(--mono); color: var(--muted); }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.scale i { height: 8px; border-radius: 2px; background: var(--track); }
.scale i.on { background: var(--amber); }
.probs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; }
.prob { display: flex; flex-direction: column; gap: 3px; font-size: 0.85rem; }
.prob .row { display: flex; justify-content: space-between; }
.prob .row b { font: 600 0.85rem var(--mono); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chart { position: relative; height: 280px; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 600 0.72rem var(--display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
th.n, td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
footer { font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Traffic with Clef</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">loading…</span></div>
  </header>

  <section class="stats" id="stats"></section>
  <section class="cams" id="cams"><div class="empty">Waiting for the first scored clip.</div></section>

  <section class="panel">
    <h2>Congestion, last 24 hours</h2>
    <div class="chart"><canvas id="chart" aria-label="Congestion score per camera over time"></canvas></div>
  </section>

  <section class="panel">
    <h2>Latest answers</h2>
    <div class="tbl"><table>
      <thead><tr><th>Captured (UTC)</th><th>Camera</th><th class="n">Congestion</th><th class="n">Moving</th><th class="n">Wet</th><th class="n">Blocked</th><th>Light</th><th class="n">Tokens</th><th class="n">Latency</th></tr></thead>
      <tbody id="recent"></tbody>
    </table></div>
  </section>

  <footer>Answers from Clef-flash on Cloudflare Workers AI. Camera images: TfL JamCams, Powered by TfL Open Data. Refreshes every 30 s.</footer>
</div>

<script>
const LEVELS = ["Empty", "Light", "Moderate", "Heavy", "Standstill"];
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pct = p => p == null ? "-" : Math.round(p * 100) + "%";
const hhmm = iso => new Date(iso).toISOString().slice(11, 16);
const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago";
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let chart;
Chart.defaults.font.family = css("--body");

function stat(k, v, s, meter) {
  return `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span>` +
    (meter != null ? `<div class="meter"><i style="width:${Math.min(100, meter)}%"></i></div>` : "") +
    `<span class="s">${s}</span></div>`;
}

function prob(label, p) {
  return `<div class="prob"><div class="row"><span>${label}</span><b>${pct(p)}</b></div>` +
    `<div class="meter"><i style="width:${(p || 0) * 100}%"></i></div></div>`;
}

function renderStats(d) {
  const t = d.today, used = t.neurons / t.neuron_limit * 100;
  document.getElementById("stats").innerHTML =
    stat("Clips today", t.clips.toLocaleString(), `${d.total_clips.toLocaleString()} since start`) +
    stat("Neurons today", t.neurons.toLocaleString(), `${used.toFixed(1)}% of ${t.neuron_limit.toLocaleString()} free`, used) +
    stat("Median call", t.latency_p50_ms ? (t.latency_p50_ms / 1000).toFixed(1) + " s" : "-", "Clef-flash, 4 frames") +
    stat("p95 call", t.latency_p95_ms ? (t.latency_p95_ms / 1000).toFixed(1) + " s" : "-", "slowest 5% today") +
    stat("Cost today", "$0", `${t.tokens.toLocaleString()} input tokens`);
}

// Cards are kept across refreshes so each video keeps playing; only the answers update.
const cards = {};
const FRAME_FALLBACK_DURATION = 9.5;

function makeCard(c, frameTimes) {
  const el = document.createElement("article");
  el.className = "cam";
  el.innerHTML = `
    <div class="stage">
      <video muted autoplay loop playsinline preload="auto"></video>
      <div class="flash" hidden></div>
      <div class="hud"></div>
    </div>
    <div class="timeline">
      <div class="track">${frameTimes.map((t, i) => `<i class="tick" data-t="${t}">${i + 1}</i>`).join("")}<b class="head"></b></div>
      <span class="tl-caption">frames sent to Clef: ${frameTimes.map(t => t.toFixed(1) + " s").join(", ")}</span>
    </div>
    <div class="body"></div>`;
  document.getElementById("cams").append(el);
  const card = {el, v: el.querySelector("video"), hud: el.querySelector(".hud"), flash: el.querySelector(".flash"),
                body: el.querySelector(".body"), head: el.querySelector(".head"), ticks: [...el.querySelectorAll(".tick")], src: null};
  const place = () => {
    const dur = card.v.duration || FRAME_FALLBACK_DURATION;
    card.ticks.forEach(t => t.style.left = (t.dataset.t / dur * 100) + "%");
  };
  card.v.addEventListener("loadedmetadata", place);
  place();
  return card;
}

function tick() {
  for (const card of Object.values(cards)) {
    const v = card.v, dur = v.duration || FRAME_FALLBACK_DURATION, now = v.currentTime;
    card.head.style.left = (now / dur * 100) + "%";
    let hit = -1;
    card.ticks.forEach((t, i) => {
      const on = Math.abs(now - t.dataset.t) < 0.4;
      t.classList.toggle("hit", on);
      if (on) hit = i;
    });
    card.flash.hidden = hit < 0;
    if (hit >= 0) card.flash.textContent = `frame ${hit + 1} of ${card.ticks.length} sent to Clef`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function renderCams(d) {
  if (!d.cameras.length) return;
  document.querySelector("#cams .empty")?.remove();
  for (const c of d.cameras) {
    const card = cards[c.id] ||= makeCard(c, d.frame_times);
    const etag = c.live_etag || c.scored_etag;
    if (card.src !== etag) {
      card.src = etag;
      card.v.poster = c.poster + "?v=" + etag;
      card.v.src = c.video + "?v=" + etag;
      card.v.play().catch(() => {});
    }
    const a = c.answers, s = a.congestion?.score ?? 0, lvl = Math.round(s);
    const fresh = c.live_etag && c.live_etag === c.scored_etag;
    const pending = c.live_etag && c.live_etag !== c.scored_etag;
    const match = fresh ? `<span class="match ok">answers for this clip</span>`
      : pending ? `<span class="match new">new clip, scoring…</span>`
      : `<span class="match unknown">answers ${ago(c.scored_at)}</span>`;

    card.hud.classList.toggle("stale", !!pending);
    card.hud.innerHTML = `<span class="hud-level">${LEVELS[lvl]} ${s.toFixed(2)}/4</span>` +
      `<span class="chip">moving ${pct(a.moving?.noul)}</span><span class="chip">wet ${pct(a.wet?.noul)}</span>` +
      `<span class="chip">blocked ${pct(a.blocked?.noul)}</span><span class="chip">${a.light?.choice ?? "-"}</span>`;
    card.body.innerHTML = `
      <div class="title"><h2>${esc(c.name)}</h2>${match}</div>
      <div class="cong">
        <div class="row"><span class="label">${LEVELS[lvl]}</span><span class="num">congestion ${s.toFixed(2)} / 4 · scored ${ago(c.scored_at)}</span></div>
        <div class="scale">${LEVELS.map((_, i) => `<i class="${i <= lvl ? "on" : ""}"></i>`).join("")}</div>
      </div>
      <div class="probs">
        ${prob("Moving", a.moving?.noul)}${prob("Wet road", a.wet?.noul)}
        ${prob("Lane blocked", a.blocked?.noul)}${prob("View usable", a.usable?.noul)}
      </div>
      <div class="prob"><div class="row"><span>Light: <b>${a.light?.choice ?? "-"}</b></span>
        <span>Heavy vehicles: <b>${(a.heavy_vehicles?.score ?? 0).toFixed(1)} / 3</b></span></div></div>`;
  }
}

function renderChart(d) {
  const colors = [css("--cam-a"), css("--cam-b"), css("--amber"), css("--red")];
  const names = Object.fromEntries(d.cameras.map(c => [c.id, c.name]));
  const datasets = Object.entries(d.series).map(([id, pts], i) => ({
    label: names[id] || id,
    data: pts.map(p => ({x: new Date(p.t).getTime(), y: p.congestion})),
    borderColor: colors[i % colors.length], backgroundColor: colors[i % colors.length],
    borderWidth: 2, pointRadius: 2, cubicInterpolationMode: "monotone",
  }));
  const grid = css("--line"), ink = css("--muted");
  if (!chart) {
    chart = new Chart(document.getElementById("chart"), {
      type: "line", data: {datasets},
      options: {
        maintainAspectRatio: false, animation: false, parsing: false,
        interaction: {mode: "nearest", intersect: false},
        scales: {
          x: {type: "linear", grid: {color: grid}, ticks: {color: ink, maxTicksLimit: 12,
              callback: v => new Date(v).toISOString().slice(11, 16)}},
          y: {min: 0, max: 4, grid: {color: grid}, ticks: {color: ink, stepSize: 1, callback: v => LEVELS[v]}},
        },
        plugins: {
          legend: {labels: {color: ink, boxWidth: 12}},
          tooltip: {callbacks: {title: items => new Date(items[0].parsed.x).toISOString().slice(11, 16) + " UTC",
                                label: i => `${i.dataset.label}: ${i.parsed.y.toFixed(2)}`}},
        },
      },
    });
  } else {
    chart.data.datasets = datasets;
    chart.update();
  }
}

function renderRecent(d) {
  document.getElementById("recent").innerHTML = d.recent.map(r => {
    const a = r.answers;
    return `<tr><td>${hhmm(r.captured_at)}</td><td>${esc(r.camera)}</td>
      <td class="n">${(a.congestion?.score ?? 0).toFixed(2)}</td><td class="n">${pct(a.moving?.noul)}</td>
      <td class="n">${pct(a.wet?.noul)}</td><td class="n">${pct(a.blocked?.noul)}</td><td>${a.light?.choice ?? "-"}</td>
      <td class="n">${r.tokens.toLocaleString()}</td><td class="n">${(r.latency_ms / 1000).toFixed(1)} s</td></tr>`;
  }).join("");
}

async function refresh() {
  const dot = document.getElementById("dot"), status = document.getElementById("status");
  try {
    const resp = await fetch("/api/summary", {cache: "no-store"});
    if (!resp.ok) throw new Error((await resp.json()).error || resp.status);
    const d = await resp.json();
    renderStats(d); renderCams(d); renderChart(d); renderRecent(d);
    const last = d.cameras.map(c => c.scored_at).sort().pop();
    const stale = last && Date.now() - new Date(last) > 12 * 60000;
    dot.className = "dot" + (stale ? " stale" : "");
    status.textContent = last ? `last clip scored ${ago(last)}` + (stale ? ", check the pipeline" : "") : "no clips yet";
  } catch (e) {
    dot.className = "dot down";
    status.textContent = "can't reach the database: " + e.message;
  }
}
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
