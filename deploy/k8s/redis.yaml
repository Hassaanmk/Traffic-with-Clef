# Redis: the waiting tray for clip jobs.
# Kept in memory only; if it restarts, the next grabber run simply re-queues the latest clips.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: streetcam
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
# Gives Redis the fixed name "redis" inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: streetcam
spec:
  selector: {app: redis}
  ports:
    - port: 6379
